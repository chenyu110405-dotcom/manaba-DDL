[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manaba-deadline"
version = "0.1.0"
description = "龙谷大学 manaba 作业只读同步与倒计时接口"
requires-python = ">=3.10"
dependencies = ["beautifulsoup4>=4.12,<5", "playwright>=1.48,<2", "tzdata>=2024.1"]

[project.scripts]
manaba-deadline = "manaba_deadline.cli:main"

[tool.setuptools.packages.find]
include = ["manaba_deadline*"]

[tool.setuptools.package-data]
manaba_deadline = ["dashboard.html", "dashboard.js", "avatars/*.jpg"]
